# vsftpd configuration for secure FTP access

# Run in foreground (required for Docker)
background=NO

# Listen on IPv4
listen=YES
listen_ipv6=NO

# Allow local users to login
local_enable=YES

# Enable write commands
write_enable=YES

# Set local user umask
local_umask=022

# Enable logging
xferlog_enable=YES
xferlog_file=/var/log/vsftpd.log

# Passive mode configuration
pasv_enable=YES
pasv_min_port=21000
pasv_max_port=21010
pasv_address=0.0.0.0

# Chroot users to their home directory for security
chroot_local_user=YES
allow_writeable_chroot=YES

# User list (only specified users can login)
userlist_enable=YES
userlist_file=/etc/vsftpd.userlist
userlist_deny=NO

# Security settings
seccomp_sandbox=NO
